workflows:
  ios-build:
    name: iOS Build

    environment:
      xcode: 16.4
      node: 20

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bmtpc.iosapp

    integrations:
      app_store_connect: codemagic

    scripts:

      - name: Install dependencies
        script: |
          rm -rf node_modules
          npm install

      - name: Install CocoaPods
        script: |
          export NODE_BINARY=$(which node)
          export RCT_NEW_ARCH_ENABLED=0

          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod deintegrate
          pod install --repo-update --verbose

      - name: Verify iOS files
        script: |
          echo "===== IOS FOLDER ====="
          ls -la ios

          echo "===== WORKSPACES ====="
          find ios -name "*.xcworkspace"

      - name: Set up signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          export NODE_BINARY=$(which node)
          export RCT_NEW_ARCH_ENABLED=0

          xcode-project build-ipa \
            --project ios/TestApp.xcodeproj \
            --scheme TestApp \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true